name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 插件文案完整性（locales / @key / 代码里的中文）
        run: python3 scripts/verify-i18n.py

      - name: registry 形状 + 本仓漂移（版本 / min_yhub / ref）
        run: python3 scripts/verify-registry.py

      - name: registry 远端漂移（外部条目按固定 ref 取 plugin.json）
        run: python3 scripts/verify-registry.py --network

      - name: 装宿主
        run: uv tool install "yhub>=0.1.3"

      - name: 真加载一遍（每个插件，en / zh-CN）
        run: python3 scripts/verify-host-load.py
